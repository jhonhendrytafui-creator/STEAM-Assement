# Netlify configuration for Next.js
[build]
  command = "npm run build"
  publish = ".next"

# Next.js plugin for Netlify (handles SSR, API routes, middleware, etc.)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables are set in Netlify UI, not here. See .env.example for
# what each one is for.
# Required env vars:
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY   <- AI Pre-Check returns 503 without it
#   GEMINI_API_KEY
#   NEXT_PUBLIC_SITE_URL
# Optional (project document generation):
#   GOOGLE_SERVICE_ACCOUNT_JSON
#   GOOGLE_APPSCRIPT_URL

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
